<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Book - BUKU SAYA</title><link rel="stylesheet" href="/style.css">
<style>
.list-book { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px; }
.mb { cursor:pointer; display:flex; flex-direction:column; gap:6px; }
.mb .cover { aspect-ratio:2/3; border-radius:3px 6px 6px 3px; padding:12px 10px; color:#fff; display:flex; align-items:flex-end; box-shadow:0 5px 12px rgba(20,41,61,.25); }
.mb .cover.has-img { padding:0; background:var(--line); } .mb .cover.has-img img { width:100%; height:100%; object-fit:cover; border-radius:3px 6px 6px 3px; display:block; }
.mb .cover span { font-family:var(--serif); font-weight:700; font-size:.85rem; }
.mb b { font-family:var(--serif); font-size:.85rem; }
.progress { height:5px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:2px; }
.progress i { display:block; height:100%; background:var(--ok); }
/* Halaman detail buku terbeli */
.mbdetail { display:none; }
.mbdetail.on { display:block; }
.mbwrap { display:grid; grid-template-columns:minmax(180px,260px) 1fr; gap:28px; align-items:start; }
.mbcover { width:100%; aspect-ratio:2/3; border-radius:3px 8px 8px 3px; }
.mbcover.has-img { background:var(--line); } .mbcover.has-img img { width:100%; height:100%; object-fit:cover; border-radius:3px 8px 8px 3px; display:block; }
.aksi-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.aksi-row .btn { padding:12px 22px; }
/* Reader sederhana */
.reader { position:fixed; inset:0; background:var(--bg); z-index:40; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.reader-top { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
.reader-top b { font-family:var(--serif); flex:1; }
.reader-body { flex:1; overflow-y:auto; padding:20px; max-width:700px; margin:0 auto; width:100%; line-height:1.8; font-size:1.05rem; }
</style></head>
<body>
<header class="top"><div class="bar"><h1 style="font-family:var(--serif);font-size:1.3rem;margin:0">My Book</h1></div></header>
<main id="main">
  <p class="muted" id="status" style="padding:0 20px">Memuat…</p>
  <div id="listWrap" style="padding:16px 20px" hidden>
    <div class="list-book" id="list"></div>
  </div>

  <div class="mbdetail" id="mbDetail" style="padding:16px 20px">
    <button class="back" id="back" type="button" style="background:none;border:0;color:var(--ink);font-weight:600;padding:8px 0">&larr; Kembali</button>
    <div class="mbwrap">
      <div id="mbCoverBox"></div>
      <div>
        <h2 id="mbTitle" style="font-family:var(--serif);margin:0 0 4px"></h2>
        <p class="muted" id="mbAuthor"></p>
        <p class="muted" id="mbProgres"></p>
        <div class="aksi-row">
          <button class="btn primary" id="btnBacaSini" type="button">Baca di sini</button>
          <button class="btn" id="btnUnduh" type="button">Unduh</button>
        </div>
        <p class="err" id="mbErr" role="alert"></p>
      </div>
    </div>
  </div>
</main>

<div class="reader" id="reader" hidden>
  <div class="reader-top">
    <button class="btn small" id="tutupReader" type="button">Tutup</button>
    <b id="readerTitle"></b>
  </div>
  <div class="reader-body" id="readerBody"></div>
</div>

<script type="module">
import { $, esc, tgl, toast, siap, api, pasangNav, onAuthStateChanged, doc, onSnapshot, collection, query, where, orderBy } from "/app.js";
pasangNav("mybook");

function coverHTML(b, cls) {
  if (b.imgUrl) return `<div class="cover ${cls} has-img"><img src="${b.imgUrl}" alt="Sampul ${esc(b.title)}"></div>`;
  return `<div class="cover ${cls}" style="background:linear-gradient(160deg, ${b.color}, ${b.color}cc)"><span>${esc(b.title)}</span></div>`;
}

let bukuMap = {}, daftarPunya = [], dipilih = null;

function tampilkanList() {
  $("mbDetail").classList.remove("on");
  $("listWrap").hidden = false;
  if (!daftarPunya.length) { $("list").innerHTML = ""; $("status").hidden = false; $("status").textContent = "Kamu belum punya buku. Yuk mulai beli di menu utama."; return; }
  $("status").hidden = true;
  $("list").innerHTML = daftarPunya.map(k => {
    const b = bukuMap[k.bukuId]; if (!b) return "";
    return `<article class="mb" data-id="${esc(k.bukuId)}">${coverHTML(b, "")}<b>${esc(b.title)}</b>
      <div class="progress"><i style="width:${Math.round((k.progres || 0) * 100)}%"></i></div></article>`;
  }).join("");
  $("list").querySelectorAll(".mb").forEach(el => el.onclick = () => bukaDetail(el.dataset.id));
}

function bukaDetail(bukuId) {
  const b = bukuMap[bukuId], k = daftarPunya.find(x => x.bukuId === bukuId);
  if (!b || !k) return;
  dipilih = { b, k };
  $("listWrap").hidden = true; $("mbDetail").classList.add("on");
  $("mbCoverBox").innerHTML = coverHTML(b, "mbcover");
  $("mbTitle").textContent = b.title; $("mbAuthor").textContent = b.author;
  $("mbProgres").textContent = "Dibeli " + tgl(k.dibeli) + (k.progres ? ` &middot; progres baca ${Math.round(k.progres * 100)}%`.replace("&middot;", "\u00B7") : "");
  $("mbErr").textContent = "";
  $("btnUnduh").disabled = !b.filePath;
  $("btnUnduh").textContent = b.filePath ? "Unduh" : "File belum tersedia";
}
$("back").onclick = tampilkanList;

$("btnBacaSini").onclick = () => {
  if (!dipilih) return;
  const { b } = dipilih;
  $("readerTitle").textContent = b.title;
  $("readerBody").innerHTML = b.isiBaca ? String(b.isiBaca).split("\n\n").map(p => `<p>${esc(p)}</p>`).join("") : `<p class="muted">${b.desc ? esc(b.desc) : "Konten baca online belum diisi admin untuk buku ini."}</p>`;
  $("reader").hidden = false;
};
$("tutupReader").onclick = () => { $("reader").hidden = true; if (dipilih) simpanProgresPerkiraan(); };
function simpanProgresPerkiraan() {
  // Perkiraan sederhana: menandai sudah dibuka. Progres presisi (per halaman) bisa ditambah nanti.
  const kProgresBaru = Math.max(dipilih.k.progres || 0, 0.1);
  api("/api/progres", { bukuId: dipilih.b.__id, progres: Math.min(1, kProgresBaru) }).catch(() => {});
}

$("btnUnduh").onclick = async () => {
  if (!dipilih || !dipilih.b.filePath) return;
  $("btnUnduh").disabled = true; $("mbErr").textContent = "";
  try { const r = await api("/api/unduh", { bukuId: dipilih.b.__id }); window.open(r.url, "_blank", "noopener"); }
  catch (e) { $("mbErr").textContent = e.message; }
  $("btnUnduh").disabled = false;
};

try {
  const { db, auth } = await siap();
  onAuthStateChanged(auth, (u) => {
    if (!u) { location.replace("/login?kembali=/mybook"); return; }
    onSnapshot(collection(db, "books"), s => { bukuMap = {}; s.forEach(d => bukuMap[d.id] = { ...d.data(), __id: d.id }); if (!$("mbDetail").classList.contains("on")) tampilkanList(); else bukaDetail(dipilih.b.__id); });
    onSnapshot(query(collection(db, "kepemilikan"), where("uid", "==", u.uid), orderBy("dibeli", "desc")), s => {
      daftarPunya = s.docs.map(d => d.data());
      const id = new URLSearchParams(location.search).get("id");
      if (id && bukuMap[id]) bukaDetail(id); else tampilkanList();
    }, () => { $("status").textContent = "Tidak bisa memuat. Pastikan indeks Firestore sudah dibuat."; });
  });
} catch (er) { $("status").textContent = er.message; }
</script>
</body></html>
