<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akun - BUKU SAYA</title><link rel="stylesheet" href="/style.css">
<style>
.profil-row { display:flex; align-items:center; gap:14px; }
.profil-row div b { font-family:var(--serif); display:block; font-size:1.1rem; }
.tabs2 { display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
.tabs2 button { flex:none; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; }
.tabs2 button[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.pane { display:none; } .pane.on { display:block; }
.wishmini { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
.wishmini .sw { width:36px; height:52px; border-radius:2px 4px 4px 2px; flex:none; background-size:cover; background-position:center; }
.wishmini .grow { flex:1; min-width:0; } .wishmini b { font-family:var(--serif); display:block; font-size:.92rem; }
</style></head>
<body>
<header class="top"><div class="bar"><h1 style="font-family:var(--serif);font-size:1.3rem;margin:0">Akun</h1><button class="btn" id="keluar" type="button">Keluar</button></div></header>
<main>
  <div class="card profil-row" id="profilCard"><div class="avatar" id="avatar">?</div><div><b id="namaUser">Memuat…</b><span class="muted" id="emailUser"></span></div></div>

  <div class="card"><span class="muted">Saldo kamu</span><p class="saldo" id="saldo">Rp0</p></div>

  <div class="tabs2" role="tablist">
    <button type="button" data-p="topup" aria-pressed="true">Top up</button>
    <button type="button" data-p="riwayat" aria-pressed="false">Riwayat</button>
    <button type="button" data-p="voucher" aria-pressed="false">Voucher</button>
    <button type="button" data-p="wishlist" aria-pressed="false">Wishlist</button>
  </div>

  <div class="pane on" id="pane-topup">
    <div class="card">
      <h2>Isi saldo</h2>
      <div class="chips" id="cepat"></div>
      <div class="field"><label for="nom">Nominal (Rp)</label><input id="nom" type="number" inputmode="numeric" min="10000" step="1000" placeholder="Contoh: 50000"></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" id="buat" type="button">Buat permintaan top up</button>
      <div class="box" id="instruksi" hidden></div>
    </div>
    <div class="card"><h2>Top up kamu</h2><div class="list" id="tops"><p class="muted">Memuat…</p></div></div>
  </div>

  <div class="pane" id="pane-riwayat">
    <div class="card"><h2>Riwayat saldo & pembelian</h2><div class="list" id="mutasi"><p class="muted">Memuat…</p></div></div>
  </div>

  <div class="pane" id="pane-voucher">
    <div class="card">
      <h2>Tukar kode voucher saldo</h2>
      <p class="muted" style="margin-top:-6px">Untuk voucher potongan harga atau buku gratis, masukkan kodenya saat checkout di halaman buku.</p>
      <div class="field"><label for="kodeVoucher">Kode voucher</label><input id="kodeVoucher" style="text-transform:uppercase" maxlength="24" placeholder="Contoh: SALDO10K"></div>
      <p class="err" id="errVoucher" role="alert"></p>
      <button class="btn primary" id="tukarVoucher" type="button">Tukar sekarang</button>
    </div>
  </div>

  <div class="pane" id="pane-wishlist">
    <div class="card"><h2>Wishlist</h2><div id="wishlistList"><p class="muted">Memuat…</p></div></div>
  </div>
</main>
<script type="module">
import { $, esc, rp, tgl, toast, siap, api, pasangNav, onAuthStateChanged, signOut, doc, onSnapshot, collection, query, where, orderBy, limit } from "/app.js";
pasangNav("akun");

document.querySelectorAll(".tabs2 button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs2 button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + b.dataset.p));
});

try {
  const { auth, db, cfg } = await siap();
  $("keluar").onclick = () => signOut(auth);
  [20000, 50000, 100000, 200000].forEach(n => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = rp(n); b.onclick = () => $("nom").value = n; $("cepat").appendChild(b); });

  let bukuMap = {};
  onSnapshot(collection(db, "books"), s => { bukuMap = {}; s.forEach(d => bukuMap[d.id] = { ...d.data(), __id: d.id }); renderWishlist(); });
  let wishIds = [];
  function renderWishlist() {
    if (!wishIds.length) { $("wishlistList").innerHTML = '<p class="muted">Belum ada buku disimpan. Ketuk ♡ Simpan di halaman buku.</p>'; return; }
    $("wishlistList").innerHTML = wishIds.map(id => { const b = bukuMap[id]; if (!b) return ""; const sw = b.imgUrl ? `background-image:url(${b.imgUrl})` : `background:${b.color}`;
      return `<a href="/buku?id=${encodeURIComponent(id)}" class="wishmini" style="text-decoration:none;color:inherit"><div class="sw" style="${sw}"></div><div class="grow"><b>${esc(b.title)}</b><span class="muted">${esc(b.author)} &middot; ${rp(b.price)}</span></div></a>`; }).join("");
  }

  onAuthStateChanged(auth, (u) => {
    if (!u) { location.replace("/login?kembali=/akun"); return; }
    const nama = u.displayName || u.email.split("@")[0];
    $("namaUser").textContent = nama; $("emailUser").textContent = u.email; $("avatar").textContent = nama[0].toUpperCase();

    onSnapshot(doc(db, "users", u.uid), s => $("saldo").textContent = rp(s.exists() ? s.data().saldo : 0));
    onSnapshot(query(collection(db, "wishlist"), where("uid", "==", u.uid)), s => { wishIds = s.docs.map(d => d.data().bukuId); renderWishlist(); });

    onSnapshot(query(collection(db, "topups"), where("uid", "==", u.uid), orderBy("dibuat", "desc"), limit(20)), s => {
      $("tops").innerHTML = s.empty ? '<p class="muted">Belum ada top up.</p>' : s.docs.map(d => { const x = d.data();
        return `<div class="row"><div><b>${rp(x.nominal)}</b><div class="muted">${tgl(x.dibuat)} &middot; transfer ${rp(x.totalTransfer)}</div></div><span class="badge ${esc(x.status)}">${esc(x.status)}</span></div>`; }).join("");
    }, () => { $("tops").innerHTML = '<p class="muted">Tidak bisa memuat (indeks Firestore).</p>'; });

    onSnapshot(query(collection(db, "ledger"), where("uid", "==", u.uid), orderBy("waktu", "desc"), limit(40)), s => {
      $("mutasi").innerHTML = s.empty ? '<p class="muted">Belum ada mutasi.</p>' : s.docs.map(d => { const x = d.data(); const plus = x.jumlah >= 0;
        const label = { topup: "Top up", beli: "Beli buku", voucher: "Voucher saldo" }[x.jenis] || x.jenis;
        return `<div class="row"><div><b>${esc(label)}</b><div class="muted">${tgl(x.waktu)}</div></div><div style="text-align:right"><span class="${plus ? "plus" : "minus"}">${plus ? "+" : ""}${rp(x.jumlah)}</span><div class="muted">saldo ${rp(x.saldoSetelah)}</div></div></div>`; }).join("");
    }, () => { $("mutasi").innerHTML = '<p class="muted">Tidak bisa memuat (indeks Firestore).</p>'; });
  });

  $("buat").onclick = async () => {
    $("err").textContent = ""; const n = Number($("nom").value);
    if (!Number.isInteger(n) || n <= 0) { $("err").textContent = "Isi nominal berupa angka bulat."; return; }
    $("buat").disabled = true;
    try {
      const r = await api("/api/topup", { nominal: n });
      const p = cfg.pembayaran || {};
      $("instruksi").hidden = false;
      $("instruksi").innerHTML = `<p style="margin:0 0 6px">Transfer <b>tepat</b> sejumlah:</p><div class="big">${rp(r.totalTransfer)}</div>
        <p class="muted" style="margin:6px 0 10px">Tiga angka terakhir (${r.kodeUnik}) adalah kode unik agar admin bisa mencocokkan transfermu.</p>
        <p style="margin:0">${esc(p.metode)}: <b>${esc(p.nomor || "(nomor belum diatur admin)")}</b><br>a.n. ${esc(p.nama || "-")}</p>
        <p class="muted" style="margin:10px 0 0">Saldo bertambah setelah admin mengonfirmasi transfermu.</p>`;
      $("nom").value = ""; toast("Permintaan top up dibuat");
    } catch (e) { $("err").textContent = e.message; }
    $("buat").disabled = false;
  };

  $("tukarVoucher").onclick = async () => {
    $("errVoucher").textContent = ""; const kode = $("kodeVoucher").value.trim();
    if (!kode) { $("errVoucher").textContent = "Isi kode voucher dulu."; return; }
    $("tukarVoucher").disabled = true;
    try { const r = await api("/api/voucher-redeem-saldo", { kode }); toast(`Berhasil! Saldo bertambah ${rp(r.nilai)}`); $("kodeVoucher").value = ""; }
    catch (e) { $("errVoucher").textContent = e.message; }
    $("tukarVoucher").disabled = false;
  };
} catch (er) { $("namaUser").textContent = "Gagal memuat"; $("emailUser").textContent = er.message; }
</script>
</body></html>
